<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chef Dashboard – Switch Order Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #333;
      color: #fff;
    }
    .new {
      background-color: #cce5ff; /* Light blue for new orders */
    }
    .done {
      background-color: #e0e0e0; /* Gray for done orders */
      color: #000;
    }
    .unknown {
      background-color: #fdd; /* Light red for unknown status */
    }
  </style>
</head>
<body>
  <h2>Chef Dashboard – Last 2 Orders per Table</h2>
  <table id="ordersTable">
    <thead>
      <tr>
        <th>Table</th>
        <th>Order ID</th>
        <th>Time</th>
        <th>Items</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const SUPABASE_URL = "https://hslabyehsyzbomxbxvts.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzbGFieWVoc3l6Ym9teGJ4dnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ2ODIyMjAsImV4cCI6MjA2MDI1ODIyMH0.wfq0pDWte6uwDVJHLczh-_k7GhDcECAwMTtCPpG8iWs";

    async function fetchOrders() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();
      renderLast2PerTable(data);
    }

    async function updateOrderStatus(orderId, newStatus) {
      await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status: newStatus })
      });
    }

    function renderLast2PerTable(orders) {
      const tbody = document.querySelector("#ordersTable tbody");
      tbody.innerHTML = "";

      const grouped = {};

      orders.forEach(order => {
        if (!grouped[order.table]) grouped[order.table] = [];
        grouped[order.table].push(order);
      });

      Object.keys(grouped).forEach(table => {
        const last2 = grouped[table]
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, 2);

        last2.forEach(order => {
          const createdAt = new Date(order.created_at);
          const rawStatus = order.status ?? "New";
          const normalizedStatus = rawStatus.toString().trim().toLowerCase();
          let rowClass = "unknown";

          if (normalizedStatus === "new") {
            rowClass = "new";
          } else if (normalizedStatus === "done") {
            rowClass = "done";
          }

          // Debug log
          console.log(`Order ID ${order.id} - Raw Status:`, rawStatus, `→ Normalized:`, normalizedStatus, `→ Class:`, rowClass);

          const row = document.createElement("tr");
          row.className = rowClass;

          row.innerHTML = `
            <td>${order.table}</td>
            <td>${order.id}</td>
            <td>${createdAt.toLocaleString()}</td>
            <td>${order.items}</td>
            <td>${order.total}</td>
            <td>
              <select data-id="${order.id}">
                <option value="New" ${normalizedStatus === "new" ? "selected" : ""}>New</option>
                <option value="Done" ${normalizedStatus === "done" ? "selected" : ""}>Done</option>
              </select>
            </td>
          `;

          // Add change event
          const select = row.querySelector("select");
          select.addEventListener("change", async (e) => {
            const newStatus = e.target.value;
            const orderId = e.target.dataset.id;
            await updateOrderStatus(orderId, newStatus);
            fetchOrders(); // Refresh table
          });

          tbody.appendChild(row);
        });
      });
    }

    fetchOrders();
    setInterval(fetchOrders, 5000); // Refresh every 60 seconds
  </script>
</body>
</html>
